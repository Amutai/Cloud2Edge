apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: cloud2edge
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: cloud2edge/mcp-server:0.2.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: edge-config
          resources:
            limits:
              memory: "128Mi"
              cpu: "200m"
            requests:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: cloud2edge
spec:
  selector:
    app: mcp-server
  ports:
    - port: 8080
      targetPort: 8080
